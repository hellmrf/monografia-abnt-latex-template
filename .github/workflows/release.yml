name: Build Final

on:
  release:
    types: [published]

# Permissão necessária para que o robô consiga anexar o arquivo no release
permissions:
  contents: write

jobs:
  build_release:
    name: Compilar Versão Final
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Compilar LaTeX
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: latest
          run: |
            latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Anexar PDF ao Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: main.pdf
